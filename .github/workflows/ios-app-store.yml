# Dial Duel iOS uygulamasını GitHub'ın bulut Mac'inde derler ve App Store Connect'e yükler.
# Çalıştırmak için: GitHub → Actions → "iOS App Store" → Run workflow
#
# Gereken repo gizlileri (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                  Apple Developer takım kimliği (10 karakter)
#   APP_STORE_CONNECT_KEY_ID       API anahtarının Key ID'si
#   APP_STORE_CONNECT_ISSUER_ID    API anahtarlarının Issuer ID'si
#   APP_STORE_CONNECT_PRIVATE_KEY  İndirilen AuthKey_XXXX.p8 dosyasının tüm içeriği
# Gizliler yoksa sadece imzasız deneme derlemesi yapılır.

name: iOS App Store

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "App Store Connect'e yükle (kapalıysa sadece deneme derlemesi)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_KEYS: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Web dosyalarını iOS projesine kopyala
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: En yeni Xcode 26'yı seç
        run: |
          # App Store, iOS 26 SDK (Xcode 26) ile derlenmiş uygulama istiyor
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; else echo "::warning::Xcode 26 bulunamadı, varsayılan Xcode kullanılıyor"; fi
          xcodebuild -version

      - name: Deneme derlemesi (imzasız)
        if: env.HAS_KEYS != 'true' || !inputs.upload
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build -quiet
          echo "### Deneme derlemesi başarılı ✅" >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_KEYS" != "true" ]; then
            echo "App Store'a yüklemek için repo gizlilerini ekle (dosyanın başındaki listeye bak)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: API anahtarını hazırla
        if: env.HAS_KEYS == 'true' && inputs.upload
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"

      - name: Arşivle ve imzala
        if: env.HAS_KEYS == 'true' && inputs.upload
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive -quiet

      - name: App Store Connect'e yükle
        if: env.HAS_KEYS == 'true' && inputs.upload
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cp ios/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "### Build $BUILD_NUMBER App Store Connect'e yüklendi ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "15-30 dakika içinde App Store Connect → TestFlight sekmesinde görünür." >> "$GITHUB_STEP_SUMMARY"

      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
